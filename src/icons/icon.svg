<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="caretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS squircle bg -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Speedy background lines -->
  <g opacity="0.15" transform="skewX(-25) translate(150, 0)">
    <rect x="-100" y="80" width="300" height="24" rx="12" fill="white"/>
    <rect x="150" y="160" width="400" height="24" rx="12" fill="white"/>
    <rect x="-50" y="240" width="500" height="24" rx="12" fill="white"/>
    <rect x="-150" y="320" width="350" height="24" rx="12" fill="white"/>
    <rect x="100" y="400" width="200" height="24" rx="12" fill="white"/>
  </g>

  <!-- Highlight behind A -->
  <rect x="55" y="150" width="170" height="200" rx="20" fill="rgba(255,255,255,0.25)"/>

  <!-- Letters -->
  <text x="140" y="325" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="200" fill="white" text-anchor="middle" filter="url(#shadow)">A</text>
  <text x="372" y="315" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="180" fill="white" text-anchor="middle" filter="url(#shadow)">文</text>

  <!-- Caret -->
  <g filter="url(#shadow)">
    <path d="M 230 150 L 282 150 M 256 150 L 256 350 M 230 350 L 282 350" fill="none" stroke="url(#caretGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
